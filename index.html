<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenScribe Standalone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "framer-motion": "https://esm.sh/framer-motion@10.16.4?deps=react@18.2.0",
        "lucide-react": "https://esm.sh/lucide-react@0.284.0?deps=react@18.2.0",
        "react-markdown": "https://esm.sh/react-markdown@9.0.0?deps=react@18.2.0",
        "clsx": "https://esm.sh/clsx@2.0.0",
        "tailwind-merge": "https://esm.sh/tailwind-merge@2.0.0",
        "htm": "https://esm.sh/htm@3.1.1"
      }
    }
    </script>

    <style>
        body { background-color: #f8f9fa; color: #1a1a1a; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; }
        .font-serif { font-family: 'Libre Baskerville', serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .focus-mode .paragraph:not(.active):not(.nearby) { opacity: 0.1; filter: blur(2px); transition: all 0.4s ease; }
        .focus-mode .paragraph.nearby { opacity: 0.4; filter: blur(0.5px); transition: all 0.4s ease; }
        .focus-mode .paragraph.active { opacity: 1; filter: blur(0); transition: all 0.4s ease; }
        .dark { background-color: #121212; color: #e0e0e0; }
        .paragraph { margin-bottom: 1em; min-height: 1.5em; outline: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import React, { useState, useRef, useEffect, useCallback } from 'react';
        import { createRoot } from 'react-dom/client';
        import { motion, AnimatePresence } from 'framer-motion';
        import * as Lucide from 'lucide-react';
        import Markdown from 'react-markdown';
        import { clsx } from 'clsx';
        import { twMerge } from 'tailwind-merge';
        import htm from 'htm';

        const html = htm.bind(React.createElement);
        const cn = (...inputs) => twMerge(clsx(inputs));

        function App() {
            const [documents, setDocuments] = useState([]);
            const [activeDocumentId, setActiveDocumentId] = useState('');
            const [isFocusMode, setIsFocusMode] = useState(true);
            const [isTypewriterMode, setIsTypewriterMode] = useState(true);
            const [isDarkMode, setIsDarkMode] = useState(false);
            const [fontSize, setFontSize] = useState(20);
            const [fontFamily, setFontFamily] = useState('serif');
            const [showSettings, setShowSettings] = useState(false);
            const [stats, setStats] = useState({ chars: 0, words: 0 });
            const [wordGoal, setWordGoal] = useState(500);
            const [isPreviewMode, setIsPreviewMode] = useState(false);

            const editorRef = useRef(null);
            const containerRef = useRef(null);

            // Load state from localStorage
            useEffect(() => {
                const savedDocs = localStorage.getItem('zenscribe-documents');
                const savedActiveId = localStorage.getItem('zenscribe-active-id');
                const savedSettings = localStorage.getItem('zenscribe-settings');

                if (savedSettings) {
                    const settings = JSON.parse(savedSettings);
                    setIsDarkMode(settings.isDarkMode ?? false);
                    setFontSize(settings.fontSize ?? 20);
                    setFontFamily(settings.fontFamily ?? 'serif');
                    setWordGoal(settings.wordGoal ?? 500);
                    setIsFocusMode(settings.isFocusMode ?? true);
                    setIsTypewriterMode(settings.isTypewriterMode ?? true);
                }

                if (savedDocs) {
                    const docs = JSON.parse(savedDocs);
                    setDocuments(docs);
                    if (savedActiveId && docs.find(d => d.id === savedActiveId)) {
                        setActiveDocumentId(savedActiveId);
                    } else if (docs.length > 0) {
                        setActiveDocumentId(docs[0].id);
                    }
                } else {
                    const initialDoc = { id: Date.now().toString(), title: 'Untitled', content: '<div class="paragraph active">Start writing your story...</div>' };
                    setDocuments([initialDoc]);
                    setActiveDocumentId(initialDoc.id);
                }
            }, []);

            // Save settings to localStorage
            useEffect(() => {
                const settings = { isDarkMode, fontSize, fontFamily, wordGoal, isFocusMode, isTypewriterMode };
                localStorage.setItem('zenscribe-settings', JSON.stringify(settings));
            }, [isDarkMode, fontSize, fontFamily, wordGoal, isFocusMode, isTypewriterMode]);

            // Save documents to localStorage
            useEffect(() => {
                if (documents.length > 0) {
                    localStorage.setItem('zenscribe-documents', JSON.stringify(documents));
                }
            }, [documents]);

            // Save active ID to localStorage
            useEffect(() => {
                if (activeDocumentId) {
                    localStorage.setItem('zenscribe-active-id', activeDocumentId);
                }
            }, [activeDocumentId]);

            // Update editor content when active document changes
            useEffect(() => {
                const activeDoc = documents.find(d => d.id === activeDocumentId);
                if (activeDoc && editorRef.current) {
                    if (editorRef.current.innerHTML !== activeDoc.content) {
                        editorRef.current.innerHTML = activeDoc.content;
                        updateStats(editorRef.current.innerText);
                    }
                }
            }, [activeDocumentId]);

            const updateStats = (text) => {
                const chars = text.length;
                const words = text.trim() ? text.trim().split(/\s+/).length : 0;
                setStats({ chars, words });
            };

            const updateFocus = useCallback(() => {
                if (!isFocusMode || !editorRef.current) return;
                const selection = window.getSelection();
                if (!selection || selection.rangeCount === 0) return;
                const range = selection.getRangeAt(0);
                let node = range.startContainer;
                const paragraphs = editorRef.current.querySelectorAll('.paragraph');
                paragraphs.forEach(p => p.classList.remove('active', 'nearby'));
                while (node && node !== editorRef.current) {
                    if (node instanceof HTMLElement && node.classList.contains('paragraph')) {
                        node.classList.add('active');
                        const prev = node.previousElementSibling;
                        if (prev && prev.classList.contains('paragraph')) prev.classList.add('nearby');
                        const next = node.nextElementSibling;
                        if (next && next.classList.contains('paragraph')) next.classList.add('nearby');
                        break;
                    }
                    node = node.parentNode;
                }
            }, [isFocusMode]);

            const updateTypewriterScroll = useCallback(() => {
                if (!isTypewriterMode || !containerRef.current) return;
                const selection = window.getSelection();
                if (!selection || selection.rangeCount === 0) return;
                const range = selection.getRangeAt(0);
                const rect = range.getBoundingClientRect();
                if (rect.top === 0 && rect.bottom === 0) return;
                const viewportHeight = window.innerHeight;
                const currentScroll = containerRef.current.scrollTop;
                const offset = rect.top - viewportHeight / 2 + rect.height / 2;
                containerRef.current.scrollTo({ top: currentScroll + offset, behavior: 'smooth' });
            }, [isTypewriterMode]);

            const handleInput = (e) => {
                const htmlContent = e.currentTarget.innerHTML;
                const text = e.currentTarget.innerText;
                
                setDocuments(prev => prev.map(d => d.id === activeDocumentId ? { ...d, content: htmlContent } : d));
                updateStats(text);

                const selection = window.getSelection();
                if (selection && selection.rangeCount > 0) {
                    const range = selection.getRangeAt(0);
                    const container = range.startContainer;
                    if (e.currentTarget.innerHTML === '' || e.currentTarget.innerHTML === '<br>') {
                        e.currentTarget.innerHTML = '<div class="paragraph active"></div>';
                        const newRange = document.createRange();
                        newRange.setStart(e.currentTarget.firstChild, 0);
                        newRange.collapse(true);
                        selection.removeAllRanges();
                        selection.addRange(newRange);
                    } else if (container === editorRef.current) {
                        document.execCommand('formatBlock', false, 'div');
                        const newPara = range.startContainer.parentElement;
                        if (newPara) newPara.classList.add('paragraph');
                    } else {
                        let p = container.parentElement;
                        while (p && p !== editorRef.current) {
                            if (p.tagName === 'DIV' || p.tagName === 'P') p.classList.add('paragraph');
                            p = p.parentElement;
                        }
                    }
                }
                updateFocus();
                if (isTypewriterMode) updateTypewriterScroll();
            };

            const downloadFile = () => {
                const text = editorRef.current?.innerText || '';
                const blob = new Blob([text], {type: 'text/plain'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url; a.download = "zenscribe-draft.txt";
                a.click();
            };

            const createNewDocument = () => {
                const newDoc = { id: Date.now().toString(), title: 'Untitled', content: '<div class="paragraph active">Start writing your story...</div>' };
                setDocuments(prev => [...prev, newDoc]);
                setActiveDocumentId(newDoc.id);
            };

            const deleteDocument = (id, e) => {
                e.stopPropagation();
                if (documents.length <= 1) return;
                const newDocs = documents.filter(d => d.id !== id);
                setDocuments(newDocs);
                if (activeDocumentId === id) {
                    setActiveDocumentId(newDocs[0].id);
                }
            };

            const renameDocument = (id, newTitle) => {
                setDocuments(prev => prev.map(d => d.id === id ? { ...d, title: newTitle } : d));
            };

            return html`
                <div className=${cn("fixed inset-0 transition-colors duration-500", isDarkMode ? "bg-[#121212] text-[#e0e0e0] dark" : "bg-[#f8f9fa] text-[#1a1a1a]")}>
                    
                    <${AnimatePresence}>
                        ${isPreviewMode && html`
                            <${motion.div} initial=${{opacity:0}} animate=${{opacity:1}} exit=${{opacity:0}} className=${cn("fixed inset-0 z-[100] overflow-y-auto p-12 md:p-24", isDarkMode ? "bg-[#121212]" : "bg-[#f8f9fa]")}>
                                <div className="max-w-2xl mx-auto relative">
                                    <button onClick=${() => setIsPreviewMode(false)} className="fixed top-8 right-8 p-3 rounded-full bg-black/5 dark:bg-white/5"><${Lucide.X} size=${20} /></button>
                                    <div className="prose dark:prose-invert prose-slate max-w-none font-serif leading-relaxed">
                                        <${Markdown}>${editorRef.current?.innerText || ''}<//>
                                    </div>
                                </div>
                            <//>
                        `}
                    <//>

                    <header className="fixed top-0 left-0 right-0 flex flex-col z-50 pointer-events-none">
                        <div className="h-16 flex items-center justify-between px-6">
                            <h1 className="font-mono text-xs opacity-30 tracking-[0.3em] uppercase pointer-events-auto">ZenScribe</h1>
                            <div className="flex items-center gap-1 pointer-events-auto">
                                <button onClick=${() => setIsPreviewMode(!isPreviewMode)} className=${cn("p-2.5 rounded-full", isPreviewMode ? "text-[#3399ff]" : "opacity-30")}><${Lucide.FileText} size=${18} /></button>
                                <button onClick=${() => setIsFocusMode(!isFocusMode)} className=${cn("p-2.5 rounded-full", isFocusMode ? "text-[#3399ff]" : "opacity-30")}>${isFocusMode ? html`<${Lucide.Eye} size=${18} />` : html`<${Lucide.EyeOff} size=${18} />`}</button>
                                <button onClick=${() => setIsTypewriterMode(!isTypewriterMode)} className=${cn("p-2.5 rounded-full", isTypewriterMode ? "text-[#3399ff]" : "opacity-30")}><${Lucide.Keyboard} size=${18} /></button>
                                <button onClick=${() => setShowSettings(!showSettings)} className="p-2.5 rounded-full opacity-30 hover:opacity-100"><${Lucide.Settings} size=${18} /></button>
                            </div>
                        </div>

                        <div className="px-6 pointer-events-auto overflow-x-auto no-scrollbar flex items-center gap-2 pb-2">
                            ${documents.map(doc => html`
                                <div key=${doc.id} onClick=${() => setActiveDocumentId(doc.id)}
                                    className=${cn("group relative flex items-center gap-2 px-4 py-2 rounded-full transition-all cursor-pointer border", activeDocumentId === doc.id ? "bg-[#3399ff] text-white border-[#3399ff] shadow-lg shadow-[#3399ff]/20" : "bg-black/5 dark:bg-white/5 border-transparent opacity-40 hover:opacity-100")}>
                                    <input value=${doc.title} onChange=${e => renameDocument(doc.id, e.target.value)} onClick=${e => e.stopPropagation()}
                                        className=${cn("bg-transparent border-none outline-none text-[10px] font-mono uppercase tracking-wider w-20 truncate", activeDocumentId === doc.id ? "text-white placeholder-white/50" : "text-current")} />
                                    ${documents.length > 1 && html`
                                        <button onClick=${e => deleteDocument(doc.id, e)} className=${cn("opacity-0 group-hover:opacity-100 transition-opacity p-0.5 rounded-full hover:bg-black/10 dark:hover:bg-white/10", activeDocumentId === doc.id && "hover:bg-white/20")}>
                                            <${Lucide.X} size=${10} />
                                        </button>
                                    `}
                                </div>
                            `)}
                            <button onClick=${createNewDocument} className="p-2 rounded-full bg-black/5 dark:bg-white/5 opacity-30 hover:opacity-100 transition-all">
                                <${Lucide.Plus} size=${14} />
                            </button>
                        </div>
                    </header>

                    <div ref=${containerRef} className="h-full overflow-y-auto no-scrollbar pt-[45vh] pb-[55vh] px-6" onScroll=${() => !isTypewriterMode && updateFocus()}>
                        <div className="max-w-2xl mx-auto relative">
                            <div ref=${editorRef} contentEditable suppressContentEditableWarning onInput=${handleInput} onKeyUp=${() => { updateFocus(); if (isTypewriterMode) updateTypewriterScroll(); }} onMouseUp=${updateFocus}
                                className=${cn("outline-none whitespace-pre-wrap leading-[1.6] min-h-[1em] caret-[#3399ff]", fontFamily === 'serif' && "font-serif", fontFamily === 'sans' && "font-sans", fontFamily === 'mono' && "font-mono", isFocusMode && "focus-mode")}
                                style=${{ fontSize: `${fontSize}px` }} spellCheck="false">
                                <div className="paragraph active">Inizia a scrivere la tua storia...</div>
                            </div>
                        </div>
                    </div>

                    <${AnimatePresence}>
                        ${showSettings && html`
                            <${React.Fragment}>
                                <${motion.div} initial=${{opacity:0}} animate=${{opacity:1}} exit=${{opacity:0}} onClick=${() => setShowSettings(false)} className="fixed inset-0 bg-black/10 backdrop-blur-[2px] z-[60]" />
                                <${motion.div} initial=${{opacity:0, y:10}} animate=${{opacity:1, y:0}} exit=${{opacity:0, y:10}} className=${cn("fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-72 p-6 rounded-[2rem] shadow-2xl z-[70]", isDarkMode ? "bg-[#1e1e1e]" : "bg-white")}>
                                    <h2 className="text-[10px] font-mono uppercase tracking-[0.2em] mb-6 opacity-40">Preferenze</h2>
                                    <div className="space-y-8">
                                        <div className="flex items-center justify-between">
                                            <span className="text-xs font-medium opacity-60">Tema</span>
                                            <button onClick=${() => setIsDarkMode(!isDarkMode)} className="px-3 py-1.5 rounded-full bg-black/5 text-[10px] uppercase font-bold">${isDarkMode ? 'Dark' : 'Light'}</button>
                                        </div>
                                        <div className="space-y-3">
                                            <div className="flex items-center justify-between text-xs opacity-60"><span>Font</span><span>${fontSize}px</span></div>
                                            <div className="grid grid-cols-3 gap-2">
                                                ${['serif', 'sans', 'mono'].map(f => html`<button onClick=${() => setFontFamily(f)} className=${cn("py-2 rounded-xl text-[9px] uppercase font-bold", fontFamily === f ? "bg-[#3399ff] text-white" : "bg-black/5")}>${f}</button>`)}
                                            </div>
                                            <input type="range" min="16" max="28" value=${fontSize} onChange=${e => setFontSize(parseInt(e.target.value))} className="w-full accent-[#3399ff]" />
                                        </div>
                                        <button onClick=${downloadFile} className="w-full py-3 rounded-2xl bg-[#3399ff] text-white text-[11px] font-bold uppercase tracking-widest">Esporta Bozza</button>
                                    </div>
                                <//>
                            <//>
                        `}
                    <//>

                    <footer className="fixed bottom-6 left-8 right-8 flex justify-between items-center pointer-events-none opacity-20">
                        <div className="font-mono text-[9px] uppercase tracking-[0.2em]">${stats.words} parole · ${stats.chars} caratteri</div>
                    </footer>
                </div>
            `;
        }

        const root = createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
